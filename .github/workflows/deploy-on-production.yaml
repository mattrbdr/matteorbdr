name: Deploy on Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to O2Switch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: github.actor == 'mattrbdr'
    env:
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deployment config
        id: config
        run: |
          set -euo pipefail
          set -a
          . ./.github/deploy/o2switch-production.env
          set +a

          {
            echo "ALLOWED_ACTOR=${ALLOWED_ACTOR}"
            echo "DEPLOY_BRANCH=${DEPLOY_BRANCH}"
            echo "NODE_VERSION=${NODE_VERSION}"
            echo "INSTALL_COMMAND=${INSTALL_COMMAND}"
            echo "CHECK_COMMANDS=${CHECK_COMMANDS}"
            echo "BUILD_COMMAND=${BUILD_COMMAND}"
            echo "BUILD_OUTPUT=${BUILD_OUTPUT}"
            echo "REMOTE_PATH=${REMOTE_PATH}"
            echo "BACKUP_PATH=${BACKUP_PATH}"
            echo "KEEP_BACKUPS=${KEEP_BACKUPS}"
          } >> "$GITHUB_ENV"

          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Guard production deployment
        run: |
          set -euo pipefail

          if [ "${GITHUB_ACTOR}" != "${ALLOWED_ACTOR}" ]; then
            echo "Only ${ALLOWED_ACTOR} can deploy production. Current actor: ${GITHUB_ACTOR}"
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "${DEPLOY_BRANCH}" ]; then
            echo "Production deploys are restricted to ${DEPLOY_BRANCH}. Current branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          for secret_name in CPANEL_USER CPANEL_HOST CPANEL_API_TOKEN SSH_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: bash -lc "$INSTALL_COMMAND"

      - name: Check project
        run: bash -lc "$CHECK_COMMANDS"

      - name: Generate static site
        run: bash -lc "$BUILD_COMMAND"

      - name: Validate build output
        run: |
          set -euo pipefail
          if [ ! -d "${BUILD_OUTPUT}" ]; then
            echo "Build output not found: ${BUILD_OUTPUT}"
            exit 1
          fi

      - name: Prepare deployment artifact
        run: |
          set -euo pipefail
          rm -rf production
          mkdir -p production/site
          cp -a "${BUILD_OUTPUT}/." production/site/

      - name: Get runner's public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Removing all whitelisted IP
        run: |
          curl -sm 45 -H"Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
          "https://${CPANEL_HOST}:2083/execute/SshWhitelist/remove_all"

      - name: Whitelisting the runner IP
        run: |
          curl -sm 45 -H"Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
          "https://${CPANEL_HOST}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22"

      - name: Ensure runner IP is whitelisted
        run: |
          curl -sm 45 -H"Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
          "https://${CPANEL_HOST}:2083/execute/SshWhitelist/list" | grep "${{ steps.ip.outputs.ipv4 }}"

      - name: Installing the SSH Key
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${SSH_KEY}" | perl -pe 's/\\n/\n/g; s/\r//g' > ~/.ssh/id_rsa
          printf "\n" >> ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa
          if ! grep -Eq '^-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----$' ~/.ssh/id_rsa; then
            echo "SSH_KEY must contain a private SSH key, not a public key."
            echo "Expected a header like: -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          echo "SSH public key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_rsa.pub
          echo "SSH public key to authorize in cPanel:"
          cat ~/.ssh/id_rsa.pub
          ssh-add ~/.ssh/id_rsa

      - name: Authorize SSH key in cPanel
        run: |
          set -euo pipefail
          KEY_NAME="github_actions_deploy"
          PUBLIC_KEY="$(cat ~/.ssh/id_rsa.pub)"

          curl -fsS -m 45 -G \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=SSH" \
            --data-urlencode "cpanel_jsonapi_func=importkey" \
            --data-urlencode "name=${KEY_NAME}" \
            --data-urlencode "key=${PUBLIC_KEY}" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel" \
            | tee /tmp/cpanel-import-key.json
          node -e "const fs=require('node:fs'); const p='/tmp/cpanel-import-key.json'; const json=JSON.parse(fs.readFileSync(p,'utf8')); const result=json?.cpanelresult?.event?.result ?? json?.status; if (result === 0 || result === '0') { console.error(JSON.stringify(json, null, 2)); process.exit(1); }"

          curl -fsS -m 45 -G \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=SSH" \
            --data-urlencode "cpanel_jsonapi_func=authkey" \
            --data-urlencode "key=${KEY_NAME}" \
            --data-urlencode "action=authorize" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel" \
            | tee /tmp/cpanel-authorize-key.json
          node -e "const fs=require('node:fs'); const p='/tmp/cpanel-authorize-key.json'; const json=JSON.parse(fs.readFileSync(p,'utf8')); const result=json?.cpanelresult?.event?.result ?? json?.status; if (result === 0 || result === '0') { console.error(JSON.stringify(json, null, 2)); process.exit(1); }"

      - name: Backup current production
        id: backup
        run: |
          set -euo pipefail
          BACKUP_NAME="production-backup-$(date +%Y%m%d-%H%M%S)"
          echo "backup_name=${BACKUP_NAME}" >> "$GITHUB_OUTPUT"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -vv \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "REMOTE_PATH='${REMOTE_PATH}' BACKUP_PATH='${BACKUP_PATH}' BACKUP_NAME='${BACKUP_NAME}' bash -s" <<'EOF'
            set -euo pipefail

            mkdir -p "${REMOTE_PATH}" "${BACKUP_PATH}"
            mkdir -p "${BACKUP_PATH}/${BACKUP_NAME}"

            if [ "$(find "${REMOTE_PATH}" -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
              echo "Backing up current production files"
              cp -a "${REMOTE_PATH}/." "${BACKUP_PATH}/${BACKUP_NAME}/"
              echo "Backup created: ${BACKUP_PATH}/${BACKUP_NAME}"
            else
              echo "Remote production path is empty. Keeping empty backup folder."
            fi
          EOF

      - name: Deploy static files with rsync
        run: |
          set -euo pipefail
          rsync --timeout=60 -e "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/id_rsa" \
            --exclude=".git" --exclude="tmp" --exclude="node_modules" --exclude="**/node_modules" \
            -av --delete production/site/ \
            "${CPANEL_USER}@${CPANEL_HOST}:${REMOTE_PATH}/"

      - name: Verify remote deployment and cleanup backups
        id: remote
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "REMOTE_PATH='${REMOTE_PATH}' BACKUP_PATH='${BACKUP_PATH}' KEEP_BACKUPS='${KEEP_BACKUPS}' bash -s" <<'EOF'
            set -euo pipefail

            test -f "${REMOTE_PATH}/index.html"
            echo "Remote index.html found"

            if [ -d "${BACKUP_PATH}" ]; then
              cd "${BACKUP_PATH}"
              ls -t | tail -n +"$((KEEP_BACKUPS + 1))" | xargs -r rm -rf
              echo "Old backups cleaned"
            fi
          EOF

      - name: Rollback production on failure
        id: rollback
        if: failure() && steps.backup.outputs.backup_name != ''
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "REMOTE_PATH='${REMOTE_PATH}' BACKUP_PATH='${BACKUP_PATH}' BACKUP_NAME='${{ steps.backup.outputs.backup_name }}' bash -s" <<'EOF'
            set -euo pipefail

            if [ ! -d "${BACKUP_PATH}/${BACKUP_NAME}" ]; then
              echo "Backup not found: ${BACKUP_PATH}/${BACKUP_NAME}"
              exit 1
            fi

            mkdir -p "${REMOTE_PATH}"
            find "${REMOTE_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "${BACKUP_PATH}/${BACKUP_NAME}/." "${REMOTE_PATH}/"
            echo "Rollback completed from ${BACKUP_PATH}/${BACKUP_NAME}"
          EOF

      - name: Remove runner IP from whitelist
        if: always()
        run: |
          curl -sm 45 -H"Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
          "https://${CPANEL_HOST}:2083/execute/SshWhitelist/remove?address=${{ steps.ip.outputs.ipv4 }}&port=22" || true

      - name: Cleaning SSH keys
        if: always()
        run: rm -fr ~/.ssh
