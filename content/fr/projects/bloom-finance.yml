title: Refonte de l'application Bloom Finance
description: Dirigé la refonte complète UX/UI et l'implémentation front-end pour une plateforme de finance personnelle, en me concentrant sur la clarté de la visualisation des données et l'amélioration du parcours d'onboarding utilisateur. Résulté en une augmentation de 32% de la rétention utilisateur.
