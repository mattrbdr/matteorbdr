testimonials:
  - quote: "Mattéo a travaillé sur deux projets pour ISE : la refonte du site, et la mise en place d'un outil de sondage des listes candidates aux élections européennes dans les 27 pays de l'UE. Il a rempli la mission avec une grande efficacité et beaucoup de souplesse. Je ne peux que me féliciter de la qualité de notre collaboration."
    author:
      name: "Martin Andler"
      description: "Professeur émérite UVSQ · Président, Initiative for Science in Europe"
  - quote: "Du site à la boutique en ligne, en passant par toute la mise en conformité légale et technique - Mattéo a géré l'ensemble du lancement. Efficace, rigoureux, et toujours capable d'expliquer clairement ce qu'il fait pour qu'on puisse s'en emparer après lui."
