seo:
  title: "Mattéo - Développeur Fullstack"
  description: "Bonjour, je suis Mattéo. Je conçois et améliore des systèmes techniques qui doivent vraiment fonctionner."
title: "Salut, je suis Mattéo, développeur freelance, je transforme des idées floues en produits qui tournent."
description: "J'interviens sur des produits et des systèmes existants pour les simplifier, les moderniser et les rendre plus efficaces. Je construis aussi des outils sur mesure quand il faut repartir de zéro. Mon objectif est simple : réduire la complexité et augmenter l'impact."
