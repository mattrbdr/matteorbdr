about:
  title: "À propos"
  description: |
    Je construis des choses sur internet depuis que j'ai l'âge de les casser.
    Je travaille aujourd'hui en freelance sur des produits qui ont besoin d'être corrigés, modernisés, ou construits de zéro. Mon projet principal est Racines — une plateforme SaaS de circuits courts que j'ai conçue et livrée seul, de l'architecture au déploiement. C'est là que je teste tout ce que j'applique ensuite avec mes clients.
    Ce qui m'importe vraiment dans une mission : comprendre le système avant de toucher au code. Et livrer quelque chose que l'autre côté peut maintenir sans moi.
