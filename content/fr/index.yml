faq:
  title: Questions fréquentes
  description: "Réponses aux questions courantes sur mon processus et mes services."
  categories:
    - title: Work & Collaboration
      questions:
        - label: Comment se passe une collaboration avec toi ?
          content: "Un échange pour valider le besoin. Un audit pour comprendre le système. Des recommandations, un cadrage clair, puis une exécution autonome avec points réguliers. Livraison à la date prévue, communication simple (Slack, WhatsApp, email)."
        - label: Tu peux travailler sur un produit existant ?
          content: "Oui. Je modernise, optimise ou remplace uniquement ce qui freine. Pas de refonte inutile."
        - label: Tu travailles en autonomie ?
          content: "Oui. Je gère l'avancée et les intervenants éventuels. J'ai juste besoin d'un contact disponible pour valider les décisions clés."
    - title: Services & Pricing
      questions:
        - label: Quels projets tu prends en charge ?
          content: "Refontes, outils internes, SaaS, audits, optimisation, web branding léger. Je ne fais pas d'applications mobiles ni de communication éditoriale."
        - label: Comment fonctionnent tes tarifs ?
          content: "TJM pour les missions courtes. Forfait pour les projets cadrés. Tarification ajustée selon le client et les objectifs."
        - label: Quel budget minimum ?
          content: "Il n'y a pas de minimum strict. J'adapte chaque mission au profil du client, à son contexte et à ses objectifs. Je travaille avec tout type de structures — PME, associations, institutions, petites équipes ou organisations plus larges. L'essentiel, c'est qu'il y ait un besoin clair et un projet qui mérite d'être fait correctement."
