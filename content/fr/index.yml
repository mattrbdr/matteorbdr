about:
  title: "À propos"
  description: |
    Je construis des sites web depuis le collège.

    Aujourd'hui, je travaille sur Racines, j'expérimente avec de nouveaux produits, et j'aide les gens à transformer des problèmes techniques compliqués en choses simples qui marchent vraiment.

    J'aime les logiciels utiles, les idées ambitieuses, et les systèmes qui n'ont pas besoin d'un manuel de 40 pages.
