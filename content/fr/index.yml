about:
  title: "À propos de moi"
  description: |
    En tant que designer UX/UI et développeuse front-end avec 6 ans d'expérience, j'utilise mon diplôme en Interactive Design de Boston University pour concevoir des expériences numériques centrées sur l'utilisateur.
    Mon approche allie stratégie créative et expertise technique, transformant les concepts en produits numériques fonctionnels et pertinents qui intègrent parfaitement design et technologie.
