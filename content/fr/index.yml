faq:
  title: Questions fréquentes
  description: "Réponses aux questions courantes sur mon processus et mes services."
  categories:
    - title: Services & Processus
      questions:
        - label: Quels services proposez-vous ?
          content: |
            Je suis spécialisée en design UX/UI et développement front-end. Cela inclut la recherche utilisateur, le wireframing, la création de prototypes interactifs, la conception d'interfaces utilisateur intuitives, la création de sites web et applications responsive (spécialement avec Vue.js/Nuxt.js), et le développement de design systems. Mon objectif est de créer des expériences numériques fluides du concept au déploiement.
        - label: Quel est votre processus de design ?
          content: |
            Mon processus est collaboratif et itératif, impliquant généralement des phases comme la Découverte & Recherche, l'Idéation & Prototypage, les Tests Utilisateurs, le Design Visuel et une étroite collaboration avec les équipes de développement pendant la mise en œuvre. J'adapte le processus selon les besoins du projet, en me concentrant toujours sur des solutions centrées sur l'utilisateur.
        - label: Travaillez-vous avec des startups ?
          content: |
            Absolument ! J'aime travailler avec les startups pour façonner leur vision produit et créer des interfaces utilisateur ergonomiques dès le départ. Je peux adapter mon processus à l'environnement startup rapide.
    - title: Tarifs & Délais
      questions:
        - label: Combien coûte généralement un projet ?
          content: |
            Les coûts des projets varient en fonction de la portée, de la complexité, des fonctionnalités et du délai. Pour des projets complets de design UX/UI et développement front-end, mes engagements commencent généralement autour de 5 000€, les projets moyens variant entre 8 000€ et 25 000€. Pour du conseil ou des tâches de design spécifiques, ma journée est à 700€.
        - label: Quelles sont vos conditions de paiement ?
          content: |
            Je demande généralement un acompte de 40% pour planifier le projet et commencer le travail, les 60% restants étant dus à la fin réussie du projet et à la livraison. J'accepte les virements bancaires et Stripe.
        - label: Combien de temps prend un projet type ?
          content: |
            Les délais dépendent fortement de la portée et de la complexité du projet. Les petits projets peuvent prendre 3-4 semaines, tandis que les projets plus importants et plus complexes peuvent aller de 2 à 4 mois. Je fournis toujours une estimation détaillée après la phase de découverte initiale.
        - label: Proposez-vous des forfaits ou un support continu ?
          content: |
            Oui, pour les clients ayant besoin d'un support design continu, de développement de fonctionnalités ou de maintenance, je propose des options de forfait mensuel adaptées aux besoins spécifiques. Discutons si cela vous intéresse.
    - title: À propos de moi
      questions:
        - label: Qu'est-ce qui vous passionne le plus dans votre travail ?
          content: |
            J'adore le défi de résoudre des problèmes complexes à travers le design et la technologie. C'est incroyablement récompenseant de voir les gens interagir avec quelque chose que j'ai créé et le trouver véritablement utile et facile à naviguer. Réduire le pont entre les besoins utilisateurs et les possibilités techniques est vraiment ce qui m'excite.
        - label: Quels sont vos loisirs en dehors du travail ?
          content: |
            Quand je ne conçois pas ou ne code pas, vous pouvez me trouver en train d'explorer les quartiers de Boston, d'essayer de nouveaux cafés et de randonnées dans les réserves proches. Je suis aussi passionnée par la photographie et contribue occasionnellement à des projets open-source.