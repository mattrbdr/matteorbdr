title: À propos
description: Mon parcours et ma façon de travailler.
content: |
  ## Les débuts

  Je construis des choses sur internet depuis que j'ai l'âge de les casser.

  Tout a commencé au collège, sans plan particulier. Je gérais le site de l'association sportive de l'établissement, je traînais sur des forums, je bidouillais. À l'époque je ne savais pas que ça s'appelait du développement web, je savais juste que c'était possible de faire des choses et que je voulais les faire. Ce premier projet a duré quatre ans. J'étais aussi délégué au conseil d'administration, membre de la commission éducative. J'ai appris très tôt que construire quelque chose, c'est aussi le défendre, le gérer, convaincre les gens autour de soi.

  Ensuite j'ai continué, dans tous les sens. Un label musical associatif régional produit de A à Z. Une plateforme de streaming vidéo qui a fini par dépasser le million de vues. Des sites pour des indépendants, des créateurs, des gens qui avaient besoin de quelqu'un capable de comprendre leur problème avant de toucher au code.

  ## Apprendre en faisant

  En parallèle j'ai travaillé dans des environnements très différents : la vente terrain, la prospection B2B, le commerce de détail. Des mondes éloignés du développement, et c'est précisément pour ça que c'était formateur. J'ai compris comment les gens prennent des décisions, ce qui les convainc, ce qui les bloque. Ça change profondément la façon dont on conçoit un produit.

  ## Ce que je fais aujourd'hui

  Aujourd'hui je travaille en freelance sur des missions où la technologie répond à un vrai besoin. Moderniser une stack qui ralentit tout. Automatiser ce que quelqu'un fait à la main depuis trop longtemps. Construire un outil sur mesure quand rien d'existant ne convient vraiment. Ce que j'apporte n'est pas juste technique : c'est une capacité à lire un système dans son ensemble et à intervenir là où ça compte.

  L'IA fait partie de ma façon de travailler au quotidien, pas comme un gadget, mais comme un levier réel. Je l'intègre là où elle accélère sans dégrader : dans les workflows, dans le code, dans la réflexion produit. Et j'aide mes clients à faire de même quand c'est pertinent.

  ## Mon projet principal

  Mon projet principal en ce moment, c'est Racines, une plateforme SaaS que j'ai conçue et développée seul pour connecter producteurs locaux et acheteurs, des particuliers aux collectivités et aux entreprises. C'est un sujet qui me tient à cœur : raccourcir les circuits, rendre l'alimentation locale accessible, donner aux producteurs des outils à la hauteur de ce qu'ils font. C'est aussi là que je teste, que j'architecture, que je pousse mes propres limites techniques avant de les appliquer ailleurs.

  ## En dehors du travail

  J'explore, je prototype, j'expérimente. Des outils qui n'existent pas encore, des problèmes que je trouve intéressants à résoudre, des systèmes que j'ai envie de comprendre de l'intérieur. Certains finissent en produit. D'autres restent dans un tiroir. Les deux m'apprennent quelque chose.

  J'écris aussi, sur des sujets très variés : tech, produit, culture, société, ce qui me traverse. Pas de ligne éditoriale fixe, juste un point de vue. Je cours, je randonne, je grimpe. Je voyage quand je peux, et chaque endroit m'apprend quelque chose sur la façon dont les gens s'organisent et construisent.

