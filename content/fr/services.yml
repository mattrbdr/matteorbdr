title: Services
description: ''
hero_tagline: "Pour les fondateurs et les équipes qui ont besoin\nd'un développeur qui comprend tout le système."
hero_text: "Je travaille sur des produits existants qui ont besoin d'être corrigés, et j'en construis de nouveaux quand repartir de zéro est la bonne décision. Je travaille en autonomie, je livre quelque chose que vous pouvez maintenir, et je vous dirai honnêtement si ce que vous pensez vouloir n'est pas ce qui vous aidera vraiment."

offerings:
  - title: "Audit & Cadrage Technique"
    subtitle: "Point de départ"
    description: "Je regarde ce qui existe, j'identifie ce qui vous bloque vraiment, et je vous donne un plan clair."
    pricing: "Périmètre fixé · à partir de 600€"
    items:
      - label: "Audit complet de votre stack et architecture"
        content: "J'analyse l'intégralité de votre codebase, infrastructure et workflows."
      - label: "Diagnostic clair : ce qui bloque vs. ce qui est du bruit"
        content: "Je sépare les blocages critiques des améliorations cosmétiques."
      - label: "Proposition d'architecture actionnable avec priorités"
        content: "Un plan concret avec ce qu'il faut faire en premier, deuxième et troisième."
      - label: "Entièrement documenté, exécutable avec ou sans moi"
        content: "Tout est documenté pour que votre équipe prenne le relais."
    good_for: "Idéal si vous avez quelque chose qui tourne mais vous ne savez pas par où commencer."
  - title: "Modernisation de Système"
    subtitle: "Produit existant"
    description: "J'améliore un produit existant sans tout réécrire pour le plaisir."
    pricing: "Périmètre fixé ou taux hebdomadaire"
    items:
      - label: "Migration legacy sans interrompre votre activité"
        content: "Zéro temps d'arrêt, zéro perte de données, zéro impact client."
      - label: "Gains de performance, pas de réécriture complète"
        content: "Je corrige les requêtes lentes, dépendances obèses, architecture inefficace."
      - label: "Nouvelles fonctionnalités sur l'architecture existante"
        content: "Des fonctionnalités conçues pour s'intégrer à votre stack actuel."
      - label: "Documentation de passation complète"
        content: "Votre équipe peut prendre le relais immédiatement."
    good_for: "Idéal si votre stack devient un frein."
  - title: "Construction sur Mesure"
    subtitle: "From scratch"
    description: "Je conçois et construis le produit de la première décision technique à la mise en production."
    pricing: "Périmètre fixé ou forfait mensuel"
    items:
      - label: "Architecture produit conçue pour vos vrais besoins"
        content: "Pas de sur-engineering, pas de décisions dictées par les tendances."
      - label: "Livraison de bout en bout : frontend, backend, infrastructure"
        content: "Tout en un seul package, de l'UI au déploiement."
      - label: "Déploiement en production et premières itérations inclus"
        content: "Un produit live avec de vrais utilisateurs dès le premier jour."
      - label: "Propriété complète du code"
        content: "Tout le code et la documentation vous appartiennent."
    good_for: "Idéal si vous avez une idée claire et avez besoin de quelqu'un pour la concrétiser."

ai_note: "Chaque projet inclut une documentation claire et une passation complète. Aucune dépendance artificielle."

faq:
  - label: "Comment se passe une collaboration avec toi ?"
    content: "Un échange pour valider le besoin. Un audit pour comprendre le système. Des recommandations, un cadrage clair, puis une exécution autonome avec points réguliers."
  - label: "Tu peux travailler sur un produit existant ?"
    content: "Oui. Je modernise, optimise ou remplace uniquement ce qui freine. Pas de refonte inutile."
  - label: "Tu travailles en autonomie ?"
    content: "Oui. Je gère l'avancée et les intervenants éventuels. J'ai juste besoin d'un contact disponible pour valider les décisions clés."
  - label: "Quels projets tu prends en charge ?"
    content: "Refontes, outils internes, SaaS, audits, optimisation, web branding léger."
  - label: "Comment fonctionnent tes tarifs ?"
    content: "TJM pour les missions courtes. Forfait pour les projets cadrés. Tarification ajustée selon le client et les objectifs."

cta_bottom_text: "Vous ne savez pas laquelle de ces offres vous correspond ? Commencez par un appel gratuit de 30 minutes - sans pitch, sans pression. On déterminera ensemble ce dont vous avez vraiment besoin."

