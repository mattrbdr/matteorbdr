title: Services
description: ''
hero_tagline: "Pour les fondateurs et les équipes qui ont besoin\nd'un développeur qui comprend tout le système."
hero_text: "Je travaille sur des produits existants qui ont besoin d'être corrigés, et j'en construis de nouveaux quand repartir de zéro est la bonne décision. Je travaille en autonomie, je livre quelque chose que vous pouvez maintenir, et je vous dirai honnêtement si ce que vous pensez vouloir n'est pas ce qui vous aidera vraiment."

offerings:
  - title: "Audit & Cadrage Technique"
    subtitle: "Point de départ"
    description: "Un engagement court à prix fixe avant tout développement. Utile quand vous êtes bloqué, débordé, ou pas sûr de quoi construire — ou corriger — ensuite."
    items:
      - "Audit complet de votre stack et architecture existante"
      - "Diagnostic honnête de ce qui vous bloque vraiment vs. ce qui n'est que du bruit"
      - "Proposition d'architecture technique avec un plan d'action priorisé"
      - "Entièrement documenté — vous pouvez l'exécuter avec ou sans moi"
    good_for: "Idéal si vous avez quelque chose qui tourne mais vous ne savez pas par où commencer."
    pricing: "Périmètre fixé · à partir de 600\u20ac"

  - title: "Modernisation de Système"
    subtitle: "Produit existant"
    description: "Pour les produits qui fonctionnent mais ralentissent tout. Je reprends la codebase existante et corrige ce qui est vraiment cassé — pas de réécriture complète, sauf si c'est vraiment la seule voie sensée."
    items:
      - "Migration legacy — WordPress, PHP, architectures monolithiques ou obsolètes"
      - "Amélioration des performances et nettoyage de la dette technique"
      - "Nouvelles fonctionnalités construites sur l'architecture existante"
      - "Documentation de passation pour ne pas dépendre de moi"
    good_for: "Idéal si votre stack devient un frein pour tout le reste."
    pricing: "Taux hebdomadaire ou périmètre fixé"

  - title: "Construction sur Mesure"
    subtitle: "From scratch"
    description: "Pour les idées qui n'existent pas encore et ont besoin d'une base solide. Je conçois et développe l'ensemble du système — de l'architecture à la mise en production — sans complexité inutile."
    items:
      - "Architecture produit et technique from scratch"
      - "Développement de bout en bout — front, back, infrastructure"
      - "Déploiement en production et premières itérations"
      - "Passation structurée — vous possédez tout à la fin"
    good_for: "Idéal si vous avez une idée claire et avez besoin de quelqu'un pour la concrétiser."
    pricing: "Périmètre fixé ou forfait mensuel"

ai_note: "Sur l'IA & l'automatisation. Ce n'est pas un service séparé — ce sont des capacités que j'applique aux trois offres quand elles aident vraiment. Automatisation de workflows, traitement intelligent de données, intégrations LLM. Je vous dirai directement si c'est overkill pour votre cas."

cta_bottom_text: "Vous ne savez pas laquelle de ces offres vous correspond ? Commencez par un appel gratuit de 30 minutes — sans pitch, sans pression. On déterminera ensemble ce dont vous avez vraiment besoin."

