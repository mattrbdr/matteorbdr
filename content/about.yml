title: About
description: My journey and how I work.
content: |
  ## The beginnings

  I've been building things on the internet since I was old enough to break them.

  It all started in middle school, with no particular plan. I managed the sports association website of the school, I hung around forums, I tinkered. At the time I didn't know it was called web development, I just knew it was possible to make things and that I wanted to make them. That first project lasted four years. I was also a delegate on the board of directors, member of the educational committee. I learned early that building something also means defending it, managing it, convincing people around you.

  Then I kept going, in every direction. A regional associative record label produced from A to Z. A video streaming platform that ended up exceeding a million views. Websites for freelancers, creators, people who needed someone capable of understanding their problem before touching the code.

  ## Learning by doing

  In parallel I worked in very different environments: field sales, B2B prospecting, retail. Worlds far from development, and that's precisely why it was formative. I understood how people make decisions, what convinces them, what blocks them. It deeply changes the way you design a product.

  ## What I do today

  Today I work freelance on missions where technology answers a real need. Modernize a stack that's slowing everything down. Automate what someone has been doing by hand for too long. Build a custom tool when nothing existing really fits. What I bring isn't just technical: it's an ability to read a system as a whole and intervene where it matters.

  AI is part of how I work daily, not as a gadget, but as a real lever. I integrate it where it speeds up without degrading: in workflows, in code, in product thinking. And I help my clients do the same when it's relevant.

  ## My main project

  My main project right now is Racines, a SaaS platform I designed and built solo to connect local producers and buyers, from individuals to local authorities and businesses. It's a topic close to my heart: shortening supply chains, making local food accessible, giving producers tools worthy of what they do. That's also where I test, where I architect, where I push my own technical limits before applying them elsewhere.

  ## Outside of work

  I explore, I prototype, I experiment. Tools that don't exist yet, problems I find interesting to solve, systems I want to understand from the inside. Some end up as products. Others stay in a drawer. Both teach me something.

  I also write, on very varied topics: tech, product, culture, society, whatever crosses my mind. No fixed editorial line, just a point of view. I run, I hike, I climb. I travel when I can, and every place teaches me something about how people organize themselves and build.

