how_i_work: |
  My approach is practical and results-oriented:

  1. **Understanding** - I start by deeply understanding your context, constraints, and goals.
  2. **Analysis** - I identify what's working, what's not, and what can be improved.
  3. **Execution** - I implement concrete solutions with clear priorities.
  4. **Knowledge Transfer** - I make sure your team can maintain and evolve what I've built.

