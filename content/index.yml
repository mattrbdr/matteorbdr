faq:
  title: "Common questions"
  description: "Answers to questions I often get asked."
  categories:
    - title: "Work & Collaboration"
      questions:
        - label: "How does collaboration work with you?"
          content: "An exchange to validate the need. An audit to understand the system. Recommendations, a clear scope, then autonomous execution with regular check-ins. Delivery on the agreed date, simple communication (Slack, WhatsApp, email)."
        - label: "Can you work on an existing product?"
          content: "Yes. I modernize, optimize or replace only what's slowing things down. No unnecessary rewrites."
        - label: "Do you work autonomously?"
          content: "Yes. I manage progress and any additional stakeholders. I just need a contact available to validate key decisions."
    - title: "Services & Pricing"
      questions:
        - label: "What projects do you take on?"
          content: "Refactors, internal tools, SaaS, audits, optimization, light web branding. I don't do mobile apps or editorial communication."
        - label: "How do your rates work?"
          content: "Day rate for short missions. Fixed price for scoped projects. Pricing adjusted according to client and objectives."
        - label: "What's the minimum budget?"
          content: "There's no strict minimum. I adapt each mission to the client's profile, context, and objectives. I work with all types of structures — SMEs, associations, institutions, small teams or larger organizations. The key is having a clear need and a project that deserves to be done properly."
