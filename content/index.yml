about:
  title: "About me"
  description: |
    I've been building things on the internet since I was old enough to break them.
    I now work freelance on products that need fixing, modernizing, or building from scratch. My main project is Racines, a SaaS platform for short supply chains that I designed and shipped solo, from architecture to deployment. That's where I test everything I then apply with clients.
    What I actually care about in a mission: understanding the system before touching the code. And handing over something the other side can maintain without me.
